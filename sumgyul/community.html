<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>커뮤니티</title>
  <link rel="stylesheet" href="./css/community.css" />
</head>
<body>
  <div class="shell">
    <main class="page" id="mainContent">

      <section class="hero" aria-label="커뮤니티 상단">
        <img class="heroBg" src="./images/stableback.png" alt="" aria-hidden="true" />
        <div class="heroShade" aria-hidden="true"></div>

        <div class="hero__inner">
          <header class="hero__topbar">
            <!-- 메뉴 버튼: aria-controls / aria-expanded 추가 (JS에서 토글) -->
            <button
              class="iconBtn"
              id="openDrawerBtn"
              type="button"
              aria-label="메뉴"
              aria-controls="drawer"
              aria-expanded="false"
            >
              <img src="./images/icon_menu.svg" class="iconImg" alt="" aria-hidden="true" />
            </button>

            <!-- 타이틀 -->
            <div class="topbarCenter" id="topbarTitle">
              <div class="topbar__centerTitle" aria-live="polite">커뮤니티</div>
            </div>

            <!-- 검색 폼 (label + name 추가) -->
            <form
              class="topbarCenter topSearch is-hidden"
              id="topSearchForm"
              role="search"
              aria-label="검색"
            >
              <label class="srOnly" for="topSearchInput"></label>
              <input
                id="topSearchInput"
                class="topSearchInput"
                type="search"
                name="q"
                placeholder="검색어를 입력하세요"
                autocomplete="off"
                aria-describedby="searchHelp"
              />
              <span id="searchHelp" class="srOnly"></span>

              <button class="iconBtn" type="submit" aria-label="검색 실행">
                <img src="./images/icon_search.svg" class="iconImg" alt="" aria-hidden="true" />
              </button>

              <button
                class="iconBtn"
                id="closeTopSearchBtn"
                type="button"
                aria-label="검색 닫기"
              >
                <span class="xGlyph" aria-hidden="true">×</span>
              </button>
            </form>

            <!-- 오른쪽 버튼 영역 -->
            <div class="topbar__right" id="topbarRight">
              <button
                class="iconBtn"
                id="openTopSearchBtn"
                type="button"
                aria-label="검색 열기"
                aria-controls="topSearchForm"
                aria-expanded="false"
              >
                <img src="./images/icon_search.svg" class="iconImg" alt="" aria-hidden="true" />
              </button>

              <button class="iconBtn" type="button" aria-label="알림">
                <img src="./images/icon_alram.svg" class="iconImg" alt="" aria-hidden="true" />
              </button>
            </div>
          </header>

          <!-- 카테고리 탭: tablist 패턴 -->
          <nav class="topTabs" aria-label="커뮤니티 카테고리" role="tablist">
            <button class="topTab" type="button" role="tab" aria-selected="false" data-cat="all">전체</button>
            <button class="topTab is-active" type="button" role="tab" aria-selected="true" data-cat="popular">인기</button>
            <button class="topTab" type="button" role="tab" aria-selected="false" data-cat="tips">꿀팁</button>
            <button class="topTab" type="button" role="tab" aria-selected="false" data-cat="question">고민&amp;질문</button>
            <button class="topTab" type="button" role="tab" aria-selected="false" data-cat="comfort">위로</button>
            <button class="topTab" type="button" role="tab" aria-selected="false" data-cat="routine">루틴</button>
          </nav>

          <!-- 정렬 칩: 토글 버튼(aria-pressed) 패턴 -->
          <section class="chips" aria-label="정렬">
            <button class="chip is-on" type="button" data-sort="hot" aria-pressed="true">인기순</button>
            <button class="chip" type="button" data-sort="new" aria-pressed="false">최신순</button>
            <button class="chip" type="button" data-sort="comment" aria-pressed="false">댓글많은순</button>
            <button class="chip" type="button" data-sort="like" aria-pressed="false">좋아요순</button>
          </section>
        </div>
      </section>

      <section class="sheet" aria-label="커뮤니티 내용">
        <section class="best" aria-label="오늘의 베스트">
          <h2 class="sectionTitle" id="bestTitle">오늘의 베스트</h2>
          <div class="bestList" id="bestList" aria-labelledby="bestTitle"></div>
        </section>

        <section class="feed" aria-label="게시글 목록">
          <div class="feedHead">
            <h2 class="sectionTitle" id="feedTitle">전체 글</h2>
          </div>

          <div class="postList" id="postList" aria-labelledby="feedTitle"></div>

          <!-- 비어있을 때 안내: live region -->
          <div class="hint" id="emptyHint" aria-live="polite" role="status"></div>
        </section>
      </section>

    </main>

    <!-- FAB -->
    <button class="fab" id="fabWriteBtn" type="button" aria-label="글쓰기">
      <img src="./images/icon_pencil.svg" alt="" aria-hidden="true" class="fab__icon" />
    </button>

    <!-- 하단 탭 -->
    <nav class="tabWrap" aria-label="하단 탭">
      <div class="tabbar" role="navigation" aria-label="주요 메뉴">
        <button class="tab" type="button" data-tab="home">
          <img class="tabImg" src="./images/icon_home.svg" alt="" aria-hidden="true" />
          <span class="tab__label">홈</span>
        </button>

        <button class="tab" type="button" data-tab="stability">
          <img class="tabImg" src="./images/icon_stability.svg" alt="" aria-hidden="true" />
          <span class="tab__label">안정</span>
        </button>

        <button class="tab" type="button" data-tab="record">
          <img class="tabImg" src="./images/icon_record.svg" alt="" aria-hidden="true" />
          <span class="tab__label">기록</span>
        </button>

        <button class="tab is-active" type="button" data-tab="community" aria-current="page">
          <img class="tabImg" src="./images/icon_community_on.svg" alt="" aria-hidden="true" />
          <span class="tab__label">커뮤니티</span>
        </button>

        <button class="tab" type="button" data-tab="my">
          <img class="tabImg" src="./images/icon_my.svg" alt="" aria-hidden="true" />
          <span class="tab__label">MY</span>
        </button>
      </div>
    </nav>

    <!-- Drawer: hidden + aria-hidden (JS에서 토글) -->
    <div class="drawer" id="drawer" aria-hidden="true" hidden>
      <div class="drawer__dim" data-close="drawer" aria-hidden="true"></div>

      <aside
        class="drawer__panel"
        role="dialog"
        aria-modal="true"
        aria-label="메뉴"
        tabindex="-1"
      >
        <header class="drawer__hd">
          <div class="drawer__profile">
            <div class="drawer__avatar" aria-hidden="true">
              <img src="./images/profile1.jpg" alt="" aria-hidden="true" />
            </div>
            <div class="drawer__who">
              <div class="drawer__name">Yejomy</div>
              <div class="drawer__sub">오늘도 천천히, 괜찮아</div>
            </div>
          </div>

          <button class="drawer__x" type="button" data-close="drawer" aria-label="닫기">×</button>
        </header>

        <div class="drawer__body">
          <button class="drawer__cta" type="button" id="drawerWriteBtn">
            <span class="drawer__ctaT1">오늘 기록하기</span>
            <span class="drawer__ctaT2">감정/일기를 바로 남겨요</span>
          </button>

          <nav class="drawer__nav" aria-label="메뉴 목록">
            <button class="drawer__item" type="button" id="drawerToMy">
              <span class="drawer__dot" aria-hidden="true"></span>
              <span class="drawer__txt">내 정보</span>
              <span class="drawer__chev" aria-hidden="true"></span>
            </button>

            <button class="drawer__item" type="button">
              <span class="drawer__dot" aria-hidden="true"></span>
              <span class="drawer__txt">알림 설정</span>
              <span class="drawer__chev" aria-hidden="true"></span>
            </button>

            <button class="drawer__item" type="button">
              <span class="drawer__dot" aria-hidden="true"></span>
              <span class="drawer__txt">공지사항</span>
              <span class="drawer__chev" aria-hidden="true"></span>
            </button>

            <button class="drawer__item drawer__item--danger" type="button">
              <span class="drawer__dot" aria-hidden="true"></span>
              <span class="drawer__txt">로그아웃</span>
              <span class="drawer__chev" aria-hidden="true"></span>
            </button>
          </nav>
        </div>

        <footer class="drawer__ft">
          <div class="drawer__ver">v1.0</div>
        </footer>
      </aside>
    </div>
  </div>

  <script src="./js/community.js"></script>
</body>
</html>
