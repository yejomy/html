<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>community</title>
  <link rel="stylesheet" href="./css/community.css" />
</head>
<body>
  <div class="shell">
    <main class="page">

      <section class="hero" aria-label="커뮤니티 상단">
        <div class="hero__inner">
          <header class="hero__topbar">
            <button class="iconBtn" id="openDrawerBtn" type="button" aria-label="메뉴">
              <img src="./images/icon_menu.svg" alt="" aria-hidden="true" class="iconImg" />
            </button>

            <div class="topbar__right">
              <button class="iconBtn" id="goSearchBtn" type="button" aria-label="검색">
                <img src="./images/icon_search.svg" alt="" aria-hidden="true" class="iconImg" />
              </button>
              <button class="iconBtn" type="button" aria-label="알림">
                <img src="./images/icon_alram.svg" alt="" aria-hidden="true" class="iconImg" />
              </button>
            </div>
          </header>

          <div class="hero__titleRow">
            <h1 class="hero__title">커뮤니티</h1>
            <div class="hero__pill">익명 · 안전한 공유</div>
          </div>

          <p class="hero__sub">
            비슷한 경험을 가진 사람들과
            작은 정보와 마음을 나눠요.
          </p>

          <!-- ✅ 검색 인풋(모달 X) -->
          <div class="searchBar" aria-label="커뮤니티 검색">
            <input id="searchInput" class="searchInput" type="text" placeholder="제목/내용/댓글 키워드로 검색" />
            <button id="searchBtn" class="searchBtn" type="button">검색</button>
          </div>
        </div>
      </section>

      <section class="sheet" aria-label="커뮤니티 콘텐츠">
        <section class="filters" aria-label="필터">
          <button class="chip is-on" type="button" data-filter="all">전체</button>
          <button class="chip" type="button" data-filter="diary">일기공유</button>
          <button class="chip" type="button" data-filter="tips">정보/팁</button>
          <button class="chip" type="button" data-filter="question">질문</button>
          <button class="chip" type="button" data-filter="comfort">위로</button>
        </section>

        <section class="feed" aria-label="게시글 목록">
          <div class="feedHead">
            <h2 class="feedTitle">새 글</h2>
            <div class="feedActions">
              <button class="smallBtn" id="seedBtn" type="button">샘플 채우기</button>
              <button class="smallBtn" id="refreshBtn" type="button">새로고침</button>
              <button class="smallBtn is-primary" id="goWriteBtn" type="button">글쓰기</button>
            </div>
          </div>

          <div class="postList" id="postList"></div>
          <div class="hint" id="emptyHint"></div>
        </section>
      </section>
    </main>

    <!-- TAB BAR -->
    <nav class="tabWrap" aria-label="하단 탭">
      <div class="tabbar">
        <button class="tab" type="button" data-tab="home">
          <img class="tabImg" src="./images/icon_home.svg" alt="홈" aria-hidden="true"/>
          <span class="tab__label">홈</span>
        </button>

        <button class="tab" type="button" data-tab="stability">
          <img class="tabImg" src="./images/icon_stability.svg" alt="안정" aria-hidden="true"/>
          <span class="tab__label">안정</span>
        </button>

        <button class="tab" type="button" data-tab="record">
          <img class="tabImg" src="./images/icon_record.svg" alt="기록" aria-hidden="true"/>
          <span class="tab__label">기록</span>
        </button>

        <button class="tab is-active" type="button" data-tab="community" aria-current="page">
          <img class="tabImg" src="./images/icon_community_on.svg" alt="커뮤니티" aria-hidden="true"/>
          <span class="tab__label">커뮤니티</span>
        </button>

        <button class="tab" type="button" data-tab="my">
          <img class="tabImg" src="./images/icon_my.svg" alt="MY" aria-hidden="true"/>
          <span class="tab__label">MY</span>
        </button>
      </div>
    </nav>

    <!-- Drawer -->
    <div class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer__dim" data-close="drawer" aria-hidden="true"></div>
      <aside class="drawer__panel" role="dialog" aria-modal="true" aria-label="메뉴">
        <header class="drawer__hd">
          <div class="drawer__profile">
            <div class="drawer__avatar" aria-hidden="true">
              <img src="./images/home_rogi.png" alt="" aria-hidden="true">
            </div>
            <div class="drawer__who">
              <div class="drawer__name">숨결록</div>
              <div class="drawer__sub">오늘도 천천히, 괜찮아</div>
            </div>
          </div>
          <button class="drawer__x" type="button" data-close="drawer" aria-label="닫기">×</button>
        </header>

        <div class="drawer__body">
          <button class="drawer__cta" type="button" id="drawerWriteBtn">
            <span class="drawer__ctaT1">오늘 기록하기</span>
            <span class="drawer__ctaT2">감정/일기를 바로 남겨요</span>
          </button>

          <nav class="drawer__nav" aria-label="메뉴 목록">
            <button class="drawer__item" type="button">
              <span class="drawer__dot" aria-hidden="true"></span>
              <span class="drawer__txt">내 정보</span>
              <span class="drawer__chev" aria-hidden="true"></span>
            </button>
            <button class="drawer__item" type="button">
              <span class="drawer__dot" aria-hidden="true"></span>
              <span class="drawer__txt">알림 설정</span>
              <span class="drawer__chev" aria-hidden="true"></span>
            </button>
            <button class="drawer__item" type="button">
              <span class="drawer__dot" aria-hidden="true"></span>
              <span class="drawer__txt">도움말</span>
              <span class="drawer__chev" aria-hidden="true"></span>
            </button>
            <button class="drawer__item drawer__item--danger" type="button">
              <span class="drawer__dot" aria-hidden="true"></span>
              <span class="drawer__txt">로그아웃</span>
              <span class="drawer__chev" aria-hidden="true"></span>
            </button>
          </nav>
        </div>

        <footer class="drawer__ft">
          <div class="drawer__ver">v1.0</div>
        </footer>
      </aside>
    </div>

  </div>

  <script src="./js/community.js"></script>
</body>
</html>
