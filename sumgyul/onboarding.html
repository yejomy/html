<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onboarding</title>
  <link rel="stylesheet" href="./css/onboarding.css">
</head>
<body>
  <main class="onboarding" aria-labelledby="onboardingTitle">

    <section class="slides" aria-label="온보딩 슬라이드">
      <!-- Slide 1 -->
      <article class="slide is-active" data-index="0" aria-hidden="false">
        <div class="slide__image slide__image--1" role="img" aria-label="온보딩 이미지 1"></div>

        <div class="slide__content">
          <h1 class="title title--lg" id="onboardingTitle">쉼의 허락</h1>
          <p class="body body--md">
            불안은 잠시 흔들림일 뿐이에요<br>
            오늘은 조금 쉬어도 괜찮아요
          </p>
        </div>
      </article>

      <!-- Slide 2 -->
      <article class="slide" data-index="1" aria-hidden="true">
        <div class="slide__image slide__image--2" role="img" aria-label="온보딩 이미지 2"></div>

        <div class="slide__content">
          <h2 class="title title--lg">함께 연습하기</h2>
          <p class="body body--md">
            불안은 혼자 감당하는 게 아니에요<br>
            우리, 함께 연습해봐요
          </p>
        </div>
      </article>

      <!-- Slide 3 (FULL IMAGE) -->
      <article class="slide slide--full" data-index="2" aria-hidden="true">
        <div class="slide__image slide__image--3 slide__image--full" role="img" aria-label="온보딩 이미지 3"></div>

        <div class="slide__overlay" role="group" aria-label="온보딩 안내">
          <h2 class="title title--lg">혼자가 아닌 나</h2>
          <p class="body body--md">
            당신은 혼자가 아니에요<br>
            여기엔 같은 길을 걷는 사람들이 함께 있어요
          </p>
        </div>
      </article>
    </section>

    <footer class="bottombar" aria-label="하단 컨트롤">
      <div class="dots" aria-label="페이지 표시">
        <button class="dot is-active" type="button" aria-label="1페이지" data-dot="0"></button>
        <button class="dot" type="button" aria-label="2페이지" data-dot="1"></button>
        <button class="dot" type="button" aria-label="3페이지" data-dot="2"></button>
      </div>

      <button class="skip subtitle subtitle--sm" id="skipBtn" type="button">SKIP</button>
    </footer>

  </main>

  <script src="./js/onboarding.js"></script>
</body>
</html>
